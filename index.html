<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>روابطي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ee;--card:#ffffff;--text:#1d1b19;--muted:#6f6a63;--accent:#e4572e;--line:#e6e0d6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14120f;--card:#201d19;--text:#f3efe8;--muted:#a49d92;--accent:#ff7a4d;--line:#332f29}}
:root[data-theme="dark"]{--bg:#14120f;--card:#201d19;--text:#f3efe8;--muted:#a49d92;--accent:#ff7a4d;--line:#332f29}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Cairo',Tahoma,Arial,sans-serif;min-height:100vh}
main{max-width:480px;margin:0 auto;padding:40px 20px 48px;text-align:center}
.avatar{width:96px;height:96px;border-radius:50%;background:var(--accent);color:#fff;font-size:44px;font-weight:900;display:grid;place-items:center;margin:0 auto 14px}
h1{margin:0;font-size:28px;font-weight:900}
p.bio{margin:6px 0 28px;color:var(--muted);font-size:16px}
a.link{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px;color:var(--text);text-decoration:none;font-weight:700;font-size:17px;transition:transform .15s,border-color .15s}
a.link:hover,a.link:focus-visible{transform:translateY(-2px);border-color:var(--accent)}
a.link .ic{font-size:24px;width:34px}
a.link .go{margin-inline-start:auto;color:var(--accent)}
footer{margin-top:28px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main>
  <div class="avatar">💪</div>
  <h1>Fitness Gym</h1>
  <p class="bio">تابعنا وتواصل معانا</p>

  <a class="link" href="https://www.instagram.com/fitness.gym.somosta?rpxt=dDRja3RrMDMwM2g4" target="_blank" rel="noopener"><span class="ic">📸</span>انستجرام<span class="go">←</span></a>
  <a class="link" href="https://www.tiktok.com/@fitness.gym685?_r=1&amp;_t=ZS-9At3pEO8XzB" target="_blank" rel="noopener"><span class="ic">🎵</span>تيك توك<span class="go">←</span></a>
  <a class="link" href="https://wa.me/201210147178" target="_blank" rel="noopener"><span class="ic">💬</span>واتساب<span class="go">←</span></a>
  <a class="link" href="tel:01210147178"><span class="ic">📞</span>اتصل بينا: 01210147178<span class="go">←</span></a>
  <a class="link" href="https://maps.app.goo.gl/H5rG9brZEYcLEGy96" target="_blank" rel="noopener"><span class="ic">📍</span>موقعنا على الخريطة<span class="go">←</span></a>

  <footer>© Fitness Gym</footer>
</main>
</body>
</html>
